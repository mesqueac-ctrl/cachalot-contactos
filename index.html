<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Directorio de contactos de clientes con notas de seguimiento." />
    <meta name="theme-color" content="#0e2233" />
    <title>Cachalot · Contactos</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('cachalot.tema')
          // Claro por defecto; el modo oscuro queda a un clic y se recuerda.
          document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
